<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>野兽先辈画像变形工坊</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:system-ui,"Yu Gothic UI",sans-serif;color:#222;background:#fff}
main{width:min(900px,100%);margin:0 auto}
h1{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;font-size:24px;margin:0 0 14px}
.wrap{width:100%;min-height:300px;display:grid;place-items:center;overflow:hidden;border:1px solid #ccc;background-color:#f4f4f4;background-image:linear-gradient(45deg,#e8e8e8 25%,transparent 25%),linear-gradient(-45deg,#e8e8e8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e8e8e8 75%),linear-gradient(-45deg,transparent 75%,#e8e8e8 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
canvas{display:block;max-width:100%;max-height:68vh;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}
button{padding:7px 11px;border:1px solid #aaa;border-radius:4px;background:#f5f5f5;color:#222;font:inherit;cursor:pointer}
button:hover{background:#e9e9e9}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:#e4efcf;border-color:#9aaf70}
.file-input{display:none}
label{font-size:13px;display:flex;align-items:center;gap:6px}
input[type=range]{width:110px}
.status{margin-left:auto;color:#666;font-size:12px}
@media(max-width:600px){body{padding:12px}.wrap{min-height:230px}.status{width:100%;margin-left:0}}
</style>
</head>
<body>
<main>
  <h1>野兽先辈画像变形工坊</h1>
  <section>
    <div class="wrap"><canvas id="canvas"></canvas></div>
    <div class="controls">
      <button class="primary" id="load">画像を読み込む</button>
      <input class="file-input" id="file" type="file" accept="image/*">
      <button id="reset">すべて元に戻す</button>
      <button id="undo">一手戻す</button>
      <button id="save">PNGで保存</button>
      <label>変形範囲 <input id="radius" type="range" min="20" max="260" value="115"></label>
      <label>引っ張る強さ <input id="power" type="range" min="10" max="250" value="100"></label>
      <span class="status" id="status">画像を読み込み中…</span>
    </div>
  </section>
</main>
<script>
(() => {
 const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
 const status=document.getElementById('status'),img=new Image();
 const fileInput=document.getElementById('file');
 let currentObjectUrl=null;
 const COLS=48,ROWS=48;
 let width=640,height=480,base=[],points=[],drag=null,animating=false,animationFrame=0;
 let radius=115,power=1,history=[];
 // 大きい画像を正しく表示するため、縮小済みのソースキャンバスを用意する
 const sourceCanvas=document.createElement('canvas');
 const sourceCtx=sourceCanvas.getContext('2d');
 const idx=(x,y)=>y*(COLS+1)+x;
 function init(){
  // 画面に収まるサイズに縮小（アスペクト比維持）
  const scale=Math.min(1,800/img.naturalWidth,640/img.naturalHeight);
  width=Math.max(1,Math.round(img.naturalWidth*scale));
  height=Math.max(1,Math.round(img.naturalHeight*scale));
  cancelAnimationFrame(animationFrame);animating=false;drag=null;
  canvas.width=width;canvas.height=height;
  // ソースも同じサイズに描き直す（これで見切れなくなる）
  sourceCanvas.width=width;
  sourceCanvas.height=height;
  sourceCtx.clearRect(0,0,width,height);
  sourceCtx.drawImage(img,0,0,width,height);
  base=[];points=[];history=[];
  for(let y=0;y<=ROWS;y++)for(let x=0;x<=COLS;x++){
   const p={x:x/COLS*width,y:y/ROWS*height};base.push({...p});points.push({...p});
  }
  updateButtons();draw();status.textContent=`${img.naturalWidth} × ${img.naturalHeight}`;
 }
 function triangle(sa,sb,sc,da,db,dc){
  const den=sa.x*(sb.y-sc.y)+sb.x*(sc.y-sa.y)+sc.x*(sa.y-sb.y);
  if(Math.abs(den)<1e-8)return;
  const a=(da.x*(sb.y-sc.y)+db.x*(sc.y-sa.y)+dc.x*(sa.y-sb.y))/den;
  const c=(da.x*(sc.x-sb.x)+db.x*(sa.x-sc.x)+dc.x*(sb.x-sa.x))/den;
  const e=(da.x*(sb.x*sc.y-sc.x*sb.y)+db.x*(sc.x*sa.y-sa.x*sc.y)+dc.x*(sa.x*sb.y-sb.x*sa.y))/den;
  const b=(da.y*(sb.y-sc.y)+db.y*(sc.y-sa.y)+dc.y*(sa.y-sb.y))/den;
  const d=(da.y*(sc.x-sb.x)+db.y*(sa.x-sc.x)+dc.y*(sb.x-sa.x))/den;
  const f=(da.y*(sb.x*sc.y-sc.x*sb.y)+db.y*(sc.x*sa.y-sa.x*sc.y)+dc.y*(sa.x*sb.y-sb.x*sa.y))/den;
  ctx.save();ctx.beginPath();ctx.moveTo(da.x,da.y);ctx.lineTo(db.x,db.y);ctx.lineTo(dc.x,dc.y);ctx.closePath();ctx.clip();
  ctx.transform(a,b,c,d,e,f);
  // フルサイズ画像ではなく、縮小済みのsourceCanvasを使う
  ctx.drawImage(sourceCanvas,0,0);
  ctx.restore();
 }
 function draw(){
  ctx.clearRect(0,0,width,height);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
   const a=idx(x,y),b=idx(x+1,y),c=idx(x,y+1),d=idx(x+1,y+1);
   triangle(base[a],base[b],base[d],points[a],points[b],points[d]);
   triangle(base[a],base[d],base[c],points[a],points[d],points[c]);
  }
 }
 function pointer(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*width/r.width,y:(e.clientY-r.top)*height/r.height}}
 function nearest(p){let bi=0,bd=Infinity;for(let i=0;i<points.length;i++){const dx=points[i].x-p.x,dy=points[i].y-p.y,d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i}}return{index:bi,dist:bd}}
 function snapshot(){history.push(points.map(p=>({x:p.x,y:p.y})));if(history.length>30)history.shift();updateButtons()}
 function updateButtons(){document.getElementById('undo').disabled=history.length===0||animating}
 // ばねのように少し行き過ぎてから、ぷるんと目標形状へ収束する
 function animateTo(target,duration=720){
  cancelAnimationFrame(animationFrame);drag=null;animating=true;updateButtons();
  const from=points.map(p=>({x:p.x,y:p.y}));
  const start=performance.now();
  function frame(now){
   const t=Math.min(1,(now-start)/duration);
   const eased=t>=1?1:1-Math.exp(-6.2*t)*Math.cos(10.5*t);
   for(let i=0;i<points.length;i++){
    points[i].x=from[i].x+(target[i].x-from[i].x)*eased;
    points[i].y=from[i].y+(target[i].y-from[i].y)*eased;
   }
   draw();
   if(t<1){animationFrame=requestAnimationFrame(frame)}
   else{points=target.map(p=>({x:p.x,y:p.y}));animating=false;updateButtons();draw()}
  }
  animationFrame=requestAnimationFrame(frame);
 }
 canvas.addEventListener('pointerdown',e=>{
  if(!img.naturalWidth||animating)return;const p=pointer(e),n=nearest(p);
  if(n.dist>Math.pow(Math.max(45,radius*.8),2))return;
  snapshot();drag={index:n.index,last:p};canvas.setPointerCapture(e.pointerId);e.preventDefault();
 });
 canvas.addEventListener('pointermove',e=>{
  if(!drag)return;const p=pointer(e),dx=(p.x-drag.last.x)*power,dy=(p.y-drag.last.y)*power,center=points[drag.index],r=radius;
  for(let i=0;i<points.length;i++){
   const ox=points[i].x-center.x,oy=points[i].y-center.y,d=Math.hypot(ox,oy);
   if(d<r){const t=1-d/r,w=t*t*(3-2*t);points[i].x+=dx*w;points[i].y+=dy*w}
  }
  drag.last=p;draw();e.preventDefault();
 });
 function release(){drag=null}
 canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
 document.getElementById('reset').addEventListener('click',()=>{if(!base.length||animating)return;snapshot();animateTo(base);});
 document.getElementById('undo').addEventListener('click',()=>{if(animating)return;const prev=history.pop();if(!prev)return;updateButtons();animateTo(prev);});
 document.getElementById('radius').addEventListener('input',e=>radius=Number(e.target.value));
 document.getElementById('power').addEventListener('input',e=>power=Number(e.target.value)/100);
 document.getElementById('save').addEventListener('click',()=>{
  if(!img.naturalWidth)return;
  const out=document.createElement('canvas');out.width=width;out.height=height;
  const octx=out.getContext('2d');
  // Render the current deformed mesh to an offscreen canvas at the same resolution.
  const oldCanvas=canvas,oldCtx=ctx;
  const a=document.createElement('a');a.download='kao-yaju-deformed.png';a.href=canvas.toDataURL('image/png');a.click();
 });
 img.onload=init;
 img.onerror=()=>{canvas.width=640;canvas.height=360;ctx.clearRect(0,0,640,360);ctx.fillStyle='#fff';ctx.font='17px sans-serif';ctx.textAlign='center';ctx.fillText('画像を読み込んでください',320,180);status.textContent='画像が見つかりません（画像を読み込んでください）'};
 document.getElementById('load').addEventListener('click',()=>fileInput.click());
 fileInput.addEventListener('change',()=>{
  const file=fileInput.files&&fileInput.files[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){status.textContent='画像ファイルを選択してください';fileInput.value='';return;}
  if(currentObjectUrl)URL.revokeObjectURL(currentObjectUrl);
  currentObjectUrl=URL.createObjectURL(file);
  status.textContent='画像を読み込み中…';
  img.src=currentObjectUrl;
  fileInput.value='';
 });
 img.src='/img/yju/yaju.png';
})();
</script>
</body>
</html>
