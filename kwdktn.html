<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>がわ゛い゛い゛な゛あ゛だぐでん゛ぐん゛</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:system-ui,"Yu Gothic UI",sans-serif;color:#222;background:#fff}
main{width:min(640px,100%);margin:0 auto}
h1{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;font-size:24px;margin:0 0 6px;line-height:1.35}
.subtitle{font-size:13px;color:#666;margin:0 0 18px}
label{display:block;font-size:13px;margin-bottom:6px;color:#444}
textarea{
  width:100%;min-height:120px;padding:12px 14px;border:1px solid #ccc;border-radius:4px;
  font:inherit;font-size:16px;line-height:1.6;resize:vertical;background:#fafafa;
}
textarea:focus{outline:none;border-color:#9aaf70;background:#fff}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
button{
  min-height:40px;padding:7px 14px;border:1px solid #aaa;border-radius:4px;
  background:#f5f5f5;color:#222;font:inherit;cursor:pointer;touch-action:manipulation
}
button:hover{background:#e9e9e9}
button.primary{background:#e4efcf;border-color:#9aaf70}
button:disabled{opacity:.4;cursor:not-allowed}
.result-box{
  width:100%;min-height:120px;padding:12px 14px;border:1px solid #ccc;border-radius:4px;
  background:#f4f4f4;font-size:16px;line-height:1.6;white-space:pre-wrap;word-break:break-all;
}
.status{margin-top:10px;font-size:12px;color:#666;min-height:18px}
@media(max-width:600px){
  body{padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
  h1{font-size:20px}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .controls button{width:100%}
}
@media(hover:none){button{min-height:44px}}
</style>
</head>
<body>
<main>
  <h1>がわ゛い゛い゛な゛あ゛だぐでん゛ぐん゛</h1>
  <p class="subtitle">入力した文字に濁点をつけます。ネイティブな濁点がある文字はそちらを優先します。</p>

  <label for="input">入力</label>
  <textarea id="input" placeholder="ここに文字を入力…　例：かわいいなあ"></textarea>

  <div class="controls">
    <button id="clear">クリア</button>
    <button class="primary" id="copy">結果をコピー</button>
  </div>

  <label>結果</label>
  <div class="result-box" id="result" aria-live="polite"></div>
  <div class="status" id="status"></div>
</main>

<script>
(() => {
  // ネイティブ濁点がある文字の対応表（優先して使う）
  const voicedMap = {
    // ひらがな
    'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご',
    'さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ',
    'た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど',
    'は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ',
    'う':'ゔ',
    // カタカナ
    'カ':'ガ','キ':'ギ','ク':'グ','ケ':'ゲ','コ':'ゴ',
    'サ':'ザ','シ':'ジ','ス':'ズ','セ':'ゼ','ソ':'ゾ',
    'タ':'ダ','チ':'ヂ','ツ':'ヅ','テ':'デ','ト':'ド',
    'ハ':'バ','ヒ':'ビ','フ':'ブ','ヘ':'ベ','ホ':'ボ',
    'ウ':'ヴ'
  };

  // すでに濁点・半濁点が付いている文字（触らない）
  const alreadyVoiced = new Set([
    'が','ぎ','ぐ','げ','ご','ざ','じ','ず','ぜ','ぞ','だ','ぢ','づ','で','ど',
    'ば','び','ぶ','べ','ぼ','ぱ','ぴ','ぷ','ぺ','ぽ','ゔ',
    'ガ','ギ','グ','ゲ','ゴ','ザ','ジ','ズ','ゼ','ゾ','ダ','ヂ','ヅ','デ','ド',
    'バ','ビ','ブ','ベ','ボ','パ','ピ','プ','ペ','ポ','ヴ'
  ]);

  // ひらがな・カタカナかどうか
  function isKana(ch) {
    const code = ch.codePointAt(0);
    return (code >= 0x3041 && code <= 0x3096) || // ひらがな
           (code >= 0x30A1 && code <= 0x30FA);   // カタカナ
  }

  function addDakuten(text) {
    let result = '';
    for (const ch of text) {
      if (voicedMap[ch]) {
        // ネイティブ濁点がある → そちらを優先
        result += voicedMap[ch];
      } else if (alreadyVoiced.has(ch)) {
        // すでに濁点・半濁点付き → そのまま
        result += ch;
      } else if (isKana(ch)) {
        // それ以外の仮名 → ゛ を付ける（最終手段）
        result += ch + '゛';
      } else {
        // 漢字・記号・英数字など → そのまま
        result += ch;
      }
    }
    return result;
  }

  const input = document.getElementById('input');
  const result = document.getElementById('result');
  const status = document.getElementById('status');
  const clearBtn = document.getElementById('clear');
  const copyBtn = document.getElementById('copy');

  function doConvert() {
    const src = input.value;
    const out = addDakuten(src);
    result.textContent = out;
    status.textContent = out ? `変換完了（${[...out].length}文字）` : '';
  }

  // 入力中にリアルタイム変換
  input.addEventListener('input', doConvert);

  clearBtn.addEventListener('click', () => {
    input.value = '';
    result.textContent = '';
    status.textContent = '';
    input.focus();
  });

  copyBtn.addEventListener('click', async () => {
    const text = result.textContent;
    if (!text) {
      status.textContent = 'コピーする結果がありません';
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      status.textContent = '結果をクリップボードにコピーしました';
    } catch {
      // フォールバック
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        status.textContent = '結果をクリップボードにコピーしました';
      } catch {
        status.textContent = 'コピーに失敗しました';
      }
      document.body.removeChild(ta);
    }
  });

  // 初期フォーカス
  input.focus();
})();
</script>
</body>
</html>
